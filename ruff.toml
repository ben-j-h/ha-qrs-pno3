# Lint config for the custom component (CI runs `ruff check custom_components/qrs_pno3`).
line-length = 100
target-version = "py312"
# research/ holds reverse-engineering notes + throwaway probe scripts, not shipped code.
extend-exclude = ["research"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
    "RUF012",    # mutable class attrs on HA entity descriptions are the norm
    "B008",      # voluptuous / selector default calls in schemas
    "ASYNC109",  # aiohttp ClientTimeout passthrough is deliberate
]

[lint.per-file-ignores]
"custom_components/qrs_pno3/library.py" = ["S608"]  # SQL built from whitelisted column names
